[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthrisk360"
version = "0.1.0"
description = "Pricing de seguro médico con MEPS 2018-2023 — portafolio actuarial"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "statsmodels",
    "scikit-learn==1.4.2",
    "matplotlib",
    "scipy",
    "joblib",
    "lightgbm",
    "shap",

    "fastapi==0.116.1",
    "starlette==0.47.2",
    "uvicorn[standard]==0.35.0",
    "pydantic",

    "streamlit==1.30.0",
    "plotly",
    "requests",

    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]